name: Verify library
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results
          if-no-files-found: ignore
  native-safari:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run build
      - run: python -m pip install 'selenium>=4.35,<5' 'Pillow>=11,<13'
      - run: sudo safaridriver --enable
      - run: python tests/native-safari.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-safari-results
          path: test-results
          if-no-files-found: ignore
